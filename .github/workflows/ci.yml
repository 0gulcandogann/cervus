name: CI

# Changes that cannot affect the build do not need a build.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

# A newer push replaces a run still going on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: make test
      - run: make test-dist

  # Unit tests only: the e2e suites have never run on macOS.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: make build
      - run: go vet ./... && go test ./...
        working-directory: cli
      - run: cargo test --locked
        working-directory: vault

  # Known vulnerabilities in what we depend on, and a short run of each fuzz test.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: cli
      - run: cargo install cargo-audit --locked --version 0.22.2 && cargo audit
        working-directory: vault
      - run: |
          go test -run='^$' -fuzz='^FuzzParseINI$' -fuzztime=20s ./cmd/cervus
          go test -run='^$' -fuzz='^FuzzParseShellKey$' -fuzztime=20s ./cmd/cervus
          go test -run='^$' -fuzz='^FuzzSTSResponses$' -fuzztime=20s ./internal/awsapi
        working-directory: cli

  # The full suites on a Mac, and the real macOS Keychain in a throwaway keychain.
  macos-e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: make build
      - run: BIN=$PWD/bin bash scripts/mac_keychain_test.sh
      - run: BIN=$PWD/bin bash scripts/e2e.sh
        if: always()
      - run: BIN=$PWD/bin bash scripts/e2e_aws.sh
        if: always()
      - run: BIN=$PWD/bin bash scripts/e2e_migrate.sh
        if: always()
      - run: BIN=$PWD/bin bash scripts/e2e_vaults.sh
        if: always()
      - run: BIN=$PWD/bin ZSH=$(command -v zsh) bash scripts/e2e_shell.sh
        if: always()
